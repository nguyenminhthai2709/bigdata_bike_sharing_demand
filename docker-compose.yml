name: bigdata-cluster

# =============================================================================
# Cụm xử lý dữ liệu lớn phân tán:
#   - Compute:       Spark (master + 2 worker), Flink (jobmanager + taskmanager)
#   - Hadoop:        HDFS (1 namenode + 2 datanode) + YARN (1 RM + 1 NM), image bde2020
#   - Orchestration: Airflow (LocalExecutor, metadata lưu trên Postgres)
#   - Storage:       MinIO (S3-compatible)
#   - Database:      PostgreSQL
#   - Streaming:     Kafka (KRaft mode, không cần Zookeeper)
#
# Chạy:      docker compose up -d
# Dừng:      docker compose down
# Xoá sạch:  docker compose down -v
# =============================================================================

x-airflow-common: &airflow-common
  image: ${AIRFLOW_IMAGE:-apache/airflow:2.9.3}
  user: "${AIRFLOW_UID:-50000}:0"
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${AIRFLOW_DB}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # Cài thêm provider để DAG có thể thao tác Spark / S3 (MinIO) / Postgres.
    # Chỉ phù hợp cho dev/demo (cài lại mỗi lần start); môi trường prod nên build
    # image riêng bằng Dockerfile thay vì dùng _PIP_ADDITIONAL_REQUIREMENTS.
    _PIP_ADDITIONAL_REQUIREMENTS: "apache-airflow-providers-apache-spark apache-airflow-providers-postgres apache-airflow-providers-amazon boto3"
  volumes:
    - ./orchestration/airflow/dags:/opt/airflow/dags
    - ./orchestration/airflow/logs:/opt/airflow/logs
    - ./orchestration/airflow/plugins:/opt/airflow/plugins
  networks:
    - bigdata-network
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ---------------------------------------------------------------------------
  # DATABASE
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      AIRFLOW_DB: ${AIRFLOW_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - bigdata-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # STORAGE (S3-compatible object storage)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    networks:
      - bigdata-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Tạo sẵn bucket mặc định rồi tự thoát (chạy 1 lần khi lên cụm)
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKETS: ${MINIO_DEFAULT_BUCKETS}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      IFS=',' &&
      for b in $$MINIO_DEFAULT_BUCKETS; do mc mb -p local/$$b || true; done &&
      echo 'MinIO buckets ready.'
      "
    networks:
      - bigdata-network

  # ---------------------------------------------------------------------------
  # STREAMING (Kafka - KRaft mode, không cần Zookeeper)
  # ---------------------------------------------------------------------------
  kafka:
    image: bitnami/kafka:3.7
    container_name: kafka
    restart: unless-stopped
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_KRAFT_CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "9094:9094"   # Kết nối từ host (client bên ngoài docker network)
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - bigdata-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ---------------------------------------------------------------------------
  # COMPUTE - Spark (batch / micro-batch)
  # ---------------------------------------------------------------------------
  spark-master:
    image: ${SPARK_IMAGE:-bitnamilegacy/spark:3.5}
    container_name: spark-master
    restart: unless-stopped
    environment:
      SPARK_MODE: master
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    ports:
      - "7077:7077"   # Spark master RPC
      - "8080:8080"   # Spark master Web UI
    volumes:
      - ./compute/spark/jobs:/opt/spark-jobs
    networks:
      - bigdata-network

  spark-worker-1:
    image: ${SPARK_IMAGE:-bitnamilegacy/spark:3.5}
    container_name: spark-worker-1
    restart: unless-stopped
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    volumes:
      - ./compute/spark/jobs:/opt/spark-jobs
    networks:
      - bigdata-network

  spark-worker-2:
    image: ${SPARK_IMAGE:-bitnamilegacy/spark:3.5}
    container_name: spark-worker-2
    restart: unless-stopped
    depends_on:
      - spark-master
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: 2
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
      SPARK_SSL_ENABLED: "no"
    volumes:
      - ./compute/spark/jobs:/opt/spark-jobs
    networks:
      - bigdata-network

  # ---------------------------------------------------------------------------
  # COMPUTE - Flink (stream processing)
  # ---------------------------------------------------------------------------
  flink-jobmanager:
    image: flink:1.18-scala_2.12
    container_name: flink-jobmanager
    restart: unless-stopped
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
    ports:
      - "8081:8081"   # Flink Web UI
    volumes:
      - ./compute/flink/jobs:/opt/flink/jobs
    networks:
      - bigdata-network

  flink-taskmanager:
    image: flink:1.18-scala_2.12
    container_name: flink-taskmanager
    restart: unless-stopped
    command: taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 2
    volumes:
      - ./compute/flink/jobs:/opt/flink/jobs
    networks:
      - bigdata-network
    # Muốn thêm taskmanager: docker compose up -d --scale flink-taskmanager=3

  # ---------------------------------------------------------------------------
  # HADOOP - HDFS + YARN
  #
  #   MASTER   : hadoop-namenode         (HDFS master)
  #              hadoop-resourcemanager  (YARN master)
  #              hadoop-historyserver    (lưu lịch sử / log job)
  #   WORKER 1 : hadoop-datanode         (HDFS storage)
  #              hadoop-nodemanager      (YARN compute)
  #   WORKER 2 : hadoop-datanode-2       (HDFS storage — thêm để block replicate 2 bản)
  #
  #   Image bde2020 chạy MỖI daemon trong 1 container riêng. Toàn bộ cấu hình
  #   Hadoop nằm ở ./hadoop/hadoop.env (dfs.replication=2 vì có 2 datanode).
  # ---------------------------------------------------------------------------
  hadoop-namenode:
    image: bde2020/hadoop-namenode:${HADOOP_IMAGE_TAG:-2.0.0-hadoop3.2.1-java8}
    container_name: hadoop-namenode
    restart: unless-stopped
    environment:
      CLUSTER_NAME: ${HADOOP_CLUSTER_NAME:-bigdata}
    env_file:
      - ./hadoop/hadoop.env
    ports:
      - "9870:9870"   # NameNode Web UI
      - "9820:9000"   # HDFS RPC (fs.defaultFS) — host dùng 9820 vì cổng 9000 đã cấp cho MinIO
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
    networks:
      - bigdata-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9870 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  hadoop-datanode:
    image: bde2020/hadoop-datanode:${HADOOP_IMAGE_TAG:-2.0.0-hadoop3.2.1-java8}
    container_name: hadoop-datanode
    restart: unless-stopped
    environment:
      SERVICE_PRECONDITION: "hadoop-namenode:9870"
    env_file:
      - ./hadoop/hadoop.env
    ports:
      - "9864:9864"   # DataNode Web UI
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
    networks:
      - bigdata-network
    depends_on:
      - hadoop-namenode

  hadoop-datanode-2:
    image: bde2020/hadoop-datanode:${HADOOP_IMAGE_TAG:-2.0.0-hadoop3.2.1-java8}
    container_name: hadoop-datanode-2
    restart: unless-stopped
    environment:
      SERVICE_PRECONDITION: "hadoop-namenode:9870"
    env_file:
      - ./hadoop/hadoop.env
    ports:
      - "9865:9864"   # DataNode Web UI (host 9865 vì 9864 đã cấp cho datanode #1)
    volumes:
      - hadoop_datanode_2:/hadoop/dfs/data
    networks:
      - bigdata-network
    depends_on:
      - hadoop-namenode

  hadoop-resourcemanager:
    image: bde2020/hadoop-resourcemanager:${HADOOP_IMAGE_TAG:-2.0.0-hadoop3.2.1-java8}
    container_name: hadoop-resourcemanager
    restart: unless-stopped
    environment:
      SERVICE_PRECONDITION: "hadoop-namenode:9000 hadoop-namenode:9870 hadoop-datanode:9864"
    env_file:
      - ./hadoop/hadoop.env
    ports:
      - "8088:8088"   # ResourceManager Web UI
    networks:
      - bigdata-network
    depends_on:
      - hadoop-namenode
      - hadoop-datanode

  hadoop-nodemanager:
    image: bde2020/hadoop-nodemanager:${HADOOP_IMAGE_TAG:-2.0.0-hadoop3.2.1-java8}
    container_name: hadoop-nodemanager
    restart: unless-stopped
    environment:
      SERVICE_PRECONDITION: "hadoop-namenode:9000 hadoop-namenode:9870 hadoop-datanode:9864 hadoop-resourcemanager:8088"
    env_file:
      - ./hadoop/hadoop.env
    ports:
      - "8042:8042"   # NodeManager Web UI
    networks:
      - bigdata-network
    depends_on:
      - hadoop-resourcemanager

  hadoop-historyserver:
    image: bde2020/hadoop-historyserver:${HADOOP_IMAGE_TAG:-2.0.0-hadoop3.2.1-java8}
    container_name: hadoop-historyserver
    restart: unless-stopped
    environment:
      SERVICE_PRECONDITION: "hadoop-namenode:9000 hadoop-namenode:9870 hadoop-datanode:9864 hadoop-resourcemanager:8088"
    env_file:
      - ./hadoop/hadoop.env
    ports:
      - "8188:8188"   # YARN Timeline / MapReduce History UI
    volumes:
      - hadoop_historyserver:/hadoop/yarn/timeline
    networks:
      - bigdata-network
    depends_on:
      - hadoop-resourcemanager

  # ---------------------------------------------------------------------------
  # ORCHESTRATION - Airflow
  # ---------------------------------------------------------------------------
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD}" \
          --firstname Admin \
          --lastname User \
          --role Admin \
          --email admin@example.com || true

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    restart: unless-stopped
    command: webserver
    ports:
      - "8085:8080"   # Airflow UI (đổi sang 8085 để tránh trùng cổng 8080 của Spark)
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    restart: unless-stopped
    command: scheduler
    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

networks:
  bigdata-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  kafka_data:
  hadoop_namenode:
  hadoop_datanode:
  hadoop_datanode_2:
  hadoop_historyserver:
