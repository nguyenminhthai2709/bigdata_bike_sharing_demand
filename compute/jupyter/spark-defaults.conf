# Áp dụng cho MỌI SparkSession tạo trong notebook.
# Khi chạy chế độ cụm (master = spark://spark-master:7077), executor nằm ở container
# khác nên phải biết địa chỉ để kết nối ngược lại driver (chính là container "jupyter").
spark.driver.host              jupyter
spark.driver.bindAddress       0.0.0.0

# Giới hạn tài nguyên xin từ cụm (cụm chỉ có 4 core / 4 GiB tổng).
spark.executor.memory          1g
spark.cores.max                2

# Đọc/ghi HDFS mặc định trỏ về namenode của cụm.
spark.hadoop.fs.defaultFS      hdfs://hadoop-namenode:9000
